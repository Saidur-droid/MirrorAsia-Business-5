name: Deploy MirrorAsia MCP to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirrorasia-mcp-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mcp
    env:
      MCP_API_TOKEN: \${{ secrets.MCP_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment credentials
        shell: bash
        run: |
          if [ -z "\${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$MCP_API_TOKEN" ] || [ "\${#MCP_API_TOKEN}" -lt 32 ]; then
            echo "::error::Missing repository secret MCP_API_TOKEN (minimum 32 characters)"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Domain tests
        run: npm test

      - name: Worker bundle validation
        run: npm run build

      - name: Deploy Worker and set MCP secret
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fd15fb7e922cdac15c71586a770e517d
          workingDirectory: mcp
          wranglerVersion: "4.164.0"
          command: deploy
          secrets: |
            MCP_API_TOKEN

      - name: Verify deployed health endpoint
        id: health
        shell: bash
        env:
          DEPLOY_OUTPUT: \${{ steps.deploy.outputs.command-output }}
        run: |
          set -euo pipefail
          worker_url="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' | head -n 1 || true)"
          if [ -z "$worker_url" ]; then
            echo "::error::Could not extract the deployed workers.dev URL from Wrangler output."
            printf '%s\n' "$DEPLOY_OUTPUT"
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          ready=0
          for i in $(seq 1 15); do
            if curl --silent --show-error --fail "$worker_url/health" -o /tmp/mirrorasia-health.json; then
              ready=1
              break
            fi
            sleep 4
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Worker health endpoint did not return HTTP 200."
            cat /tmp/mirrorasia-health.json 2>/dev/null || true
            exit 1
          fi
          cat /tmp/mirrorasia-health.json
          echo "### MirrorAsia MCP deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: $worker_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Health endpoint: $worker_url/health" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify remote MCP protocol and all tools
        env:
          MCP_BASE_URL: \${{ steps.health.outputs.worker_url }}
          MCP_API_TOKEN: \${{ secrets.MCP_API_TOKEN }}
        run: npm run smoke
