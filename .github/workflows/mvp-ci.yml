name: MirrorAsia MVP CI
on:
  push:
    branches: ["main", "feat/iabc-2026-mvp-foundation"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
