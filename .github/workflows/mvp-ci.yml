name: MirrorAsia MVP CI
on:
  push:
    branches: ["main", "feat/iabc-2026-mvp-foundation"]
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies (bootstrap)
        run: npm install --no-audit --no-fund
      - name: Commit first package lockfile on MVP feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/iabc-2026-mvp-foundation'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(mvp): pin npm dependency lockfile"
            git push origin HEAD:refs/heads/feat/iabc-2026-mvp-foundation
          fi
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
