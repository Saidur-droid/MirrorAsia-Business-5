name: MirrorAsia MVP CI
on:
  push:
    branches: ["main", "feat/iabc-2026-mvp-foundation"]
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - name: Commit refreshed npm lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/iabc-2026-mvp-foundation'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(mvp): lock Cloudflare build dependency versions"
            git push origin HEAD:refs/heads/feat/iabc-2026-mvp-foundation
          fi
      - name: Verify Cloudflare build
        run: npm run build:pages
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: HTTP integration smoke test
        shell: bash
        run: |
          npm run start -- -p 3100 > /tmp/mirrorasia-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 35); do
            if curl --silent --fail http://127.0.0.1:3100/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          node -e 'const a=require("/tmp/health.json"); if(a.status!=="ok") process.exit(1)'
          curl --fail --silent --show-error -H "Content-Type: application/json" -X POST \
            http://127.0.0.1:3100/api/simulate \
            --data '{"country":"Bangladesh","city":"Dhaka","targetSegment":"young-professionals","concepts":[{"id":"A","name":"Concept Alpha","color":"black","message":"A hypothetical marketing message"},{"id":"B","name":"Concept Beta","color":"red","message":"Another hypothetical marketing message"}],"prices":[79,89,99],"syntheticAgents":120,"seed":42}' > /tmp/result.json
          node -e 'const a=require("/tmp/result.json"); if(a.rows?.length!==18 || a.mode!=="preview" || a.provenance.realRespondents!==0 || a.confidence.mirrorScore!==null) process.exit(1)'
