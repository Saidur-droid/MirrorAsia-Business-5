name: Refresh built Worker bundle once
on:
  push:
    branches: [feat/iabc-2026-mvp-foundation]
    paths: [".github/workflows/refresh-worker-once.yml"]
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/feat/iabc-2026-mvp-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --no-audit --no-fund
      - run: npm run build:pages
      - run: npm run build:worker
      - name: Commit generated bundle
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare-generated/mirrorasia-worker.mjs worker/generated-assets.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-generated/mirrorasia-worker.mjs worker/generated-assets.ts
          git commit -m "build(worker): refresh release bundle with protected DB diagnostics"
          git push origin HEAD:feat/iabc-2026-mvp-foundation
